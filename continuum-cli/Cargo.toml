[package]
name = "continuum-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for Continuum: portable judgment kernel management"

[[bin]]
name = "continuum"
path = "src/main.rs"

[dependencies]
continuum = { path = "../continuum" }
clap = { version = ">=4.4,<4.5", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
hex = "0.4"
