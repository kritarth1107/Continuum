[package]
name = "continuum"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Portable judgment kernel + continuity seal for agent identity persistence"
readme = "../README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
uuid = { version = ">=1.6,<1.8", features = ["v4", "serde"] }
zeroize = ">=1.5,<1.8"
getrandom = { version = ">=0.2,<0.3", features = ["std"] }
base64ct = ">=1.5,<1.7"

[dev-dependencies]
tempfile = ">=3.5,<3.10"
criterion = "0.5"

[[bench]]
name = "crypto_benchmarks"
harness = false
